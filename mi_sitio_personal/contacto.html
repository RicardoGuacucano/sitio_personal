<!DOCTYPE html>

<head>

<body>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre_mi.html">Sobre Mi</a></li>
            <li><a href="contacto.html" class="activa">Contactame</a></li>
        </ul>
    </nav>

    <h1>Contactame</h1>
    <p>Si quieres dejar un mensaje deja tu informacion a continuaciòn.</p>

    <table border="1">
        <form>
            <tr>
                <th>
                    Nombre
                </th>
                <th>
                    Correo
                </th>
            </tr>
            <tr>
                <td>
                    <input type="text" name="Nombre" required placeholder="Nombre">
                </td>
                <td>
                    <input type="email" name="Correo" required placeholder="tucorreo@email.com">
                </td>
            </tr>
            <tr>
                <th>
                    Mensaje
                </th>
                <th>
                    Asunto
                </th>
            </tr>
            <tr>
                <td align="center">
                    <textarea name="Mensaje"></textarea>
                </td>
                <td align="center">
                    <select name="Asunto">
                        <option value="sin asunto" selected>-selecciona tu asunto-</option>
                        <option value="consulta">Consulta</option>
                        <option value="reclamo">Reclamo</option>
                        <option value="otro">Otros</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Enviar</button>
                </td>
            </tr>
        </form>
    </table>
    <h3>Encuentrame en UMAG</h3>
    <p>En la facultad de ingenieria de 7:20 PM hasta las 10:20 PM</p>
    <img src="img/mapa_umag.jpeg" alt="mapa del campus UMAG">

    <footer>
        <p>Ricardo Guacucano 2026</p>
    </footer>
</body>
