<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto / Mi pagina</title>
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre_mi.html">Sobre Mi</a></li>
        </ul>
    </nav>

    <h1>Contactame</h1>
    <p>Si quieres dejar un mensaje deja tu informacion a continuaciòn.</p>

    <table border="1">
        <form>
            <tr>
                <th>
                    Nombre
                </th>
                <th>
                    Correo
                </th>
            </tr>
            <tr>
                <td>
                    <input type="text" name="Nombre" required placeholder="Nombre">
                </td>
                <td>
                    <input type="email" name="Correo" required placeholder="tucorreo@email.com">
                </td>
            </tr>
            <tr>
                <th colspan="2">
                    Mensaje
                </th>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <textarea name="Mensaje"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Enviar</button>
                </td>
            </tr>

        </form>
    </table>

    <footer>
        <p>Ricardo Guacucano 2026</p>
    </footer>
</body>

</html>
